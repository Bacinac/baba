[project]
name = "baba-ingestor"
version = "0.1.0"
description = "RTSP ingestor supervisor — owns one ffmpeg worker per row in cameras table"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "asyncpg>=0.30",
    "nats-py>=2.9",
    "msgspec>=0.19",
    "numpy>=2.2",
]
# The decoder plugins each image variant ships: only its own. A hardware
# variant has nothing to fall back to, so a broken decoder stops the ingestor.
[project.optional-dependencies]
cpu = ["baba-decoder-software"]
nvidia = ["baba-decoder-ffmpeg-nvdec"]
intel = ["baba-decoder-intel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_ingestor"]

[project.scripts]
baba-ingestor = "baba_ingestor.__main__:main"
