[project]
name = "baba-tracker"
version = "0.1.0"
description = "Norfair per-camera tracker with OSNet inline ReID — consumes detections, publishes tracks"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "asyncpg>=0.30",
    "nats-py>=2.9",
    "msgspec>=0.19",
    "numpy>=2.2",
    "norfair>=2.3",
    # opencv for crop slicing + resize + NV12→RGB conversion in the
    # ReID hot path (FrameRingReader yields NV12 by default).
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_tracker"]

[project.scripts]
baba-tracker = "baba_tracker.__main__:main"
