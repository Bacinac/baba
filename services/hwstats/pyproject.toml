[project]
name = "baba-hwstats"
version = "0.1.0"
description = "Hardware stats collector (CPU/RAM/GPU) for BABA — publishes baba.stats.hardware, vendor-agnostic (nvidia-smi / intel_gpu_top)"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "nats-py>=2.9",
    "msgspec>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_hwstats"]
