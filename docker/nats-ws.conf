# WebSocket listener — the only way a remote consumer reaches this bus when the
# site is fronted by an HTTP tunnel, which carries HTTP and WebSocket but never a
# raw TCP port. DIDA's baba adapter speaks wss:// natively, so a second house
# needs no VPN and no second protocol: same subjects, same credentials, different
# transport. The client's TLS ends at the tunnel; this listener speaks TLS as well
# so the LAN leg from the tunnel connector is not plaintext either. Its
# certificate is made afresh at every start (docker/nats-start.sh): the connector
# in front of it does not verify an internal origin (DIDA's tunnel renders an
# https:// origin with noTLSVerify), so there is nothing to pin or renew.
# Included only when .env sets BABA_NATS_WS_BIND_IP, which also decides what of
# it reaches the LAN; the accounts in nats-auth.conf guard it exactly as they
# guard 4222. Publishing it without them would put an open bus on the internet.
websocket {
  port: 4223
  tls {
    cert_file: "/etc/nats/ws.crt"
    key_file: "/etc/nats/ws.key"
  }
}
