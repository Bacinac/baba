# NATS server config for BABA — plain pub/sub; nothing on this bus uses
# JetStream. docker/nats-start.sh includes this first, then nats-ws.conf and
# nats-auth.conf as the environment asks for them.

server_name: baba-nats
listen: 0.0.0.0:4222

# The largest message on the bus is the detector's raw-trace reply to an
# incident replay: at most 600 frames × 32 detections, about 1 MB of JSON, just
# over the 1 MB default. Frames themselves travel through the SHM rings.
max_payload: 8MB

# HTTP monitoring port, used by the compose healthcheck. Loopback-bound so it
# never leaves the container.
http: 127.0.0.1:8222
