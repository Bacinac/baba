# The accounts, which docker/nats-start.sh always includes.
# Everything structural lives in nats.conf; this file adds only the accounts, so
# the two can never drift on ports or limits. The passwords are bcrypt hashes
# the start script derives from the plaintext ones in .env.
#
# Two accounts, because two very different things reach this bus:
#
#   NATS_USER      — BABA's own services (detector, ingestor, embedder, api, …).
#                    They publish the whole subject space, and they reach the bus
#                    over loopback 4222, which never leaves the host.
#
#   BABA_PEER_NATS — a remote mirror, i.e. DIDA's baba adapter. It arrives over
#                    the WebSocket listener, which on a tunnelled site is exposed
#                    to the public internet. A mirror only ever READS, so it gets
#                    read-only permissions plus the one request it must send.
#
# Without the split, the credential that lets a mirror read camera state is the
# same credential that can publish to any subject BABA listens on — so anyone who
# obtains it could forge state or drive the system, not merely watch it.
# `allowed_connection_types` on the unrestricted account is the important half.
# Restricting what the mirror may PUBLISH is not enough on its own: both accounts
# answer on both listeners, so that credential would still be usable over the
# WebSocket — i.e. from the internet on a tunnelled site — and there it could
# publish anywhere. Pinning it to STANDARD means the exposed listener does not
# accept it at all, and BABA's own services lose nothing: they reach the bus over
# loopback 4222.
#
# The mirror is deliberately allowed on BOTH transports. It reaches a LAN site
# over TCP and a tunnelled site over WebSocket, and it is read-only either way —
# so one config serves every instance instead of a per-host variant, which is how
# instances drift apart in the first place.
authorization {
  users = [
    { user: $NATS_USER, password: $NATS_PASSWORD_BCRYPT, allowed_connection_types: ["STANDARD"] }

    # Read-only mirror. Its one request is baba.roster.get, and the reply comes
    # back under its own inbox prefix `_INBOX.dida` (DIDA's baba adapter connects
    # with it). The shared `_INBOX.>` carries the replies of BABA's own services,
    # which a mirror must neither read nor answer; publishing there let it forge
    # a reply to a request meant for the state-evaluator.
    { user: $BABA_PEER_NATS_USER, password: $BABA_PEER_NATS_PASSWORD_BCRYPT,
      allowed_connection_types: ["STANDARD", "WEBSOCKET"],
      permissions: {
        # Every subject a mirror may read is named here, so a new one is a
        # deliberate act rather than something that leaks out with the next
        # publish. One token per camera: request/reply between BABA's services
        # lives under `baba.rpc.>`, never under these. `baba.place.*` carries
        # arrivals and departures; the mirror is NOT given `baba.events.>`,
        # which is the whole firehose.
        subscribe: { allow: ["baba.state.*", "baba.bell.*", "baba.place.*",
                             "baba.roster", "_INBOX.dida.>"] }
        publish:   { allow: ["baba.roster.get"] }
      }
    }
  ]
}
