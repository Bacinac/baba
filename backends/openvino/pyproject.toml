[project]
name = "baba-backend-openvino"
version = "0.1.0"
description = "Intel OpenVINO backend for BABA (Arc / iGPU / CPU)"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "numpy>=2.2",
    # 2026.2+: the 2025.0 GPU plugin can't compile RT-DETR in fp16 (layout bug
    # at convert->MatMul), which forced the detector to f32 and pinned the Arc
    # Compute engine near 90%. The 2026.x line fixes it; the floor also busts
    # any uv cache still holding the 2025.0.0 wheel.
    "openvino>=2026.2",
]

[project.entry-points."baba.backends"]
openvino = "baba_backend_openvino:OpenVINOBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_backend_openvino"]
