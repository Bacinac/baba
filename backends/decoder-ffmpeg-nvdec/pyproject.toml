[project]
name = "baba-decoder-ffmpeg-nvdec"
version = "0.1.0"
description = "NVIDIA NVDEC video decoder for BABA — spawns ffmpeg as a subprocess to keep RTSP demux and packet handling out of Python"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "numpy>=2.2",
]

[project.entry-points."baba.decoders"]
ffmpeg-nvdec-nv12 = "baba_decoder_ffmpeg_nvdec:FFmpegNvdecNV12Decoder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_decoder_ffmpeg_nvdec"]
