[project]
name = "baba-backend-tensorrt"
version = "0.1.0"
description = "NVIDIA TensorRT backend for BABA"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "numpy>=2.2",
    # The backend builds strongly typed networks (the only kind TensorRT 11
    # has), so FP16 comes from converting the ONNX graph, not a builder flag.
    "tensorrt>=11",
    "cuda-python>=13",
    "onnx>=1.19",
    "onnxconverter-common>=1.16",
]

[project.entry-points."baba.backends"]
tensorrt = "baba_backend_tensorrt:TensorRTBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_backend_tensorrt"]
