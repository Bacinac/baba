[project]
name = "baba-decoder-software"
version = "0.1.0"
description = "Software (CPU) video decoder for BABA — PyAV/ffmpeg, always available"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "av",
    "numpy>=2.2",
    "opencv-python-headless>=4.10",
]

[project.entry-points."baba.decoders"]
software = "baba_decoder_software:SoftwareDecoder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_decoder_software"]
