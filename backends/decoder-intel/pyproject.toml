[project]
name = "baba-decoder-intel"
version = "0.1.0"
description = "Intel hardware video decoders for BABA — QSV (oneVPL) and VAAPI, both spawning ffmpeg to decode + downscale on Arc / iGPU media silicon"
requires-python = ">=3.14"
dependencies = [
    "baba-core",
    "numpy>=2.2",
]

[project.entry-points."baba.decoders"]
qsv-nv12 = "baba_decoder_intel:FFmpegQsvNV12Decoder"
vaapi-nv12 = "baba_decoder_intel:FFmpegVaapiNV12Decoder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baba_decoder_intel"]
